<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

<script>
  // Highlight the header link for the section currently in view (home page only).
  (function () {
    var links = document.querySelectorAll('.masthead__menu-item a[href*="/#"]');
    var map = {};
    links.forEach(function (a) {
      var id = a.getAttribute('href').split('#')[1];
      var el = document.getElementById(id);
      if (el) { map[id] = a; }
    });
    if (!Object.keys(map).length || !('IntersectionObserver' in window)) { return; }
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) { return; }
        links.forEach(function (a) { a.classList.remove('is-active'); });
        map[entry.target.id].classList.add('is-active');
      });
    }, { rootMargin: '-20% 0px -70% 0px' });
    Object.keys(map).forEach(function (id) { observer.observe(document.getElementById(id)); });
  })();

  // Show the back-to-top button once the reader has scrolled past the intro.
  (function () {
    var btn = document.querySelector('.back-to-top');
    if (!btn) { return; }
    var onScroll = function () { btn.classList.toggle('is-visible', window.scrollY > 600); };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();

  // Email button: also copy the address, since many visitors have no mail app set up.
  (function () {
    var btn = document.querySelector('.js-copy-email');
    if (!btn) { return; }
    var label = btn.querySelector('span');
    var address = btn.getAttribute('href').replace('mailto:', '');
    var timer;
    var show = function (text) {
      label.textContent = text;
      clearTimeout(timer);
      timer = setTimeout(function () { label.textContent = 'Email'; }, 4000);
    };
    btn.addEventListener('click', function () {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(address).then(
          function () { show('Email copied'); },
          function () { show(address); }
        );
      } else {
        show(address);
      }
    });
  })();
</script>
